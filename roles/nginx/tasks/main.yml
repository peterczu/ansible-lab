# tasks file for roles/nginx
---
- name: Ensure Nginx is installed
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Deploy Nginx site configuration
  ansible.builtin.template:
    src: nginx-site.conf.j2
    dest: /etc/nginx/sites-available/ansible-site
    owner: root
    group: root
    mode: '0644'
  notify: Reload Nginx

- name: Enable Ansible-managed Nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/ansible-site
    dest: /etc/nginx/sites-enabled/ansible-site
    state: link

- name: Disable default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Nginx
